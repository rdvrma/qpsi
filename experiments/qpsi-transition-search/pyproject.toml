[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qpsi-transition-search"
version = "0.1.0"
description = "Q-Psi Classical vs CUDA-Q Candidate-Transition Selection Experiment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
cudaq = [
    "cudaq>=0.9.0; platform_system == 'Linux'",
]

[tool.setuptools.packages.find]
where = ["src"]
